version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      # tsc -b && vite build -> dist/
      # tsconfig.app.json is strict (noUnusedLocals/noUnusedParameters),
      # so an unused import fails the deploy rather than shipping.
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# vite-plugin-pwa runs with registerType: 'autoUpdate'. If index.html or sw.js
# is cached at the edge, clients pin an old service worker and stop receiving
# updates, so only the hashed files under /assets are immutable.
customHeaders:
  - pattern: '/assets/**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, must-revalidate'
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, must-revalidate'
  - pattern: '/registerSW.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, must-revalidate'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, must-revalidate'
